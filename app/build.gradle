plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'nz.cassey.bptracker'
    compileSdk 34

    defaultConfig {
        applicationId "nz.cassey.bptracker"
        minSdk 29
        targetSdk 34
        versionCode 11
        versionName "1.13"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // On-device OCR; the model ships inside the APK, so no internet is used.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Only for FileProvider (camera hand-off to a temp file).
    implementation 'androidx.core:core-ktx:1.13.1'
}
