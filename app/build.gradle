plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'nz.cassey.bptracker'
    compileSdk 34

    defaultConfig {
        applicationId "nz.cassey.bptracker"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// No external dependencies — platform APIs only.
dependencies { }
