name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             out/bp-tracker-v${{ github.run_number }}.apk

      # Actions artifact downloads redirect to Azure blob storage, so publish
      # a Release asset as well — that URL is directly tappable on the phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BP Tracker v${{ github.run_number }}
          files: out/bp-tracker-v${{ github.run_number }}.apk
          generate_release_notes: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bp-tracker-apk
          path: out/*.apk
